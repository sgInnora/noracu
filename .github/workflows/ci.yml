name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium # (--with-deps is Linux-only; macOS runners need no system deps)
      - name: "syntax: server, engine, scripts, imctl"
        run: npm run check
      - name: "engine unit tests (node:vm, no macOS permissions needed)"
        run: node test/engine-unit.mjs
      - name: "e2e (CI mode: browser layer + security regressions; hardware-dependent tests skipped)"
        run: NORACU_CI=1 node test/e2e.mjs
        env:
          NORACU_IMCTL_DIR: /nonexistent # phone layer degrades gracefully on CI
      - name: "docs freshness: tools.md must match running server (panel R4)"
        run: |
          node scripts/gen-tools.mjs
          git diff --exit-code docs/tools.md || (echo "::error::docs/tools.md is stale — run: node scripts/gen-tools.mjs" && exit 1)
      - name: "package contents: runtime files present, internal material absent"
        run: node scripts/check-pack.mjs
